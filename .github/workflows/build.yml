name: build-tr3000

on:
  workflow_dispatch:
    inputs:
      list_only:
        description: "Только показать defconfig и профили, без сборки"
        type: boolean
        default: false
      ref:
        description: "Коммит для сборки (пусто = последний в ветке)"
        type: string
        default: "4c657c9354"
      defconfig:
        description: "Имя файла из defconfig/"
        type: string
        default: "mt7981-ax3000.config"
      device:
        description: "Профиль устройства"
        type: choice
        options:
          - cudy_tr3000-v1
          - cudy_tr3000-v1-ubootmod
          - cudy_tr3000-v1-256mb
        default: cudy_tr3000-v1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout нужного коммита
        if: ${{ inputs.ref != '' }}
        run: |
          git checkout "${{ inputs.ref }}"
          git log -1 --format='%H %cd %s'

      - name: Inspect repo
        run: |
          echo "=== defconfig/ ==="
          ls -1 defconfig/
          echo "=== профили TR3000 ==="
          grep -nE 'define Device/.*tr3000' target/linux/mediatek/image/filogic.mk || true

      - name: Free disk space
        if: ${{ !inputs.list_only }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build environment
        if: ${{ !inputs.list_only }}
        run: sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'

      - name: Feeds
        if: ${{ !inputs.list_only }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare .config
        if: ${{ !inputs.list_only }}
        run: |
          set -e
          cp "defconfig/${{ inputs.defconfig }}" .config
          DEV="${{ inputs.device }}"

          grep -q "^define Device/${DEV}\$" target/linux/mediatek/image/filogic.mk \
            || { echo "Профиль $DEV не найден"; exit 1; }

          # убираем все устройства из defconfig, MULTI_PROFILE оставляем
          sed -i -E '/^CONFIG_TARGET_DEVICE_/d' .config
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEV}=y" >> .config
          echo "CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_${DEV}=\"\"" >> .config

          {
            echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-rndis=y"
            echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y"
            echo "CONFIG_PACKAGE_usb-modeswitch=y"
          } >> .config

          make defconfig

          echo "=== итоговые устройства ==="
          grep -E '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y' .config

          grep -q "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEV}=y" .config || { echo "Профиль не включился"; exit 1; }
          [ "$(grep -cE '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y' .config)" = "1" ] || { echo "Включено больше одного устройства"; exit 1; }
          grep -q '^CONFIG_PACKAGE_kmod-usb-net-rndis=y' .config || { echo "rndis не включился"; exit 1; }
          grep -q '^CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y' .config || { echo "cdc-ether не включился"; exit 1; }

      - name: Download sources
        if: ${{ !inputs.list_only }}
        run: make -j$(nproc) download

      - name: Build
        if: ${{ !inputs.list_only }}
        run: make -j$(nproc) || make -j1 V=s

      - name: Check kernel dependency
        if: ${{ !inputs.list_only && always() }}
        run: |
          cd bin/targets/mediatek/filogic/packages || exit 0
          for f in kmod-usb-net-cdc-ether_*.ipk kmod-usb-net-cdc-ncm_*.ipk; do
            echo "== $f"
            tar -xOzf "$f" ./control.tar.gz | tar -xzO ./control | grep -E "^(Depends|Architecture)"
          done
          echo
          echo "Нужно: kernel (= 6.6.95~9e1eecd385406f9a23903187ccf6347c-r1)"

      - name: Upload firmware
        if: ${{ !inputs.list_only }}
        uses: actions/upload-artifact@v4
        with:
          name: tr3000-firmware
          path: |
            bin/targets/
            .config
          retention-days: 30
